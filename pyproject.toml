[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyredirectcage"
version = "1.0.0"
description = "Zero-dependency open redirect and return URL defense for Python"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "pyredirectcage contributors" }]
keywords = ["open-redirect", "cwe-601", "security", "url", "redirect"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
pyredirectcage = "pyredirectcage.cli:main"

[project.urls]
Homepage = "https://github.com/draarivpatel-ui/pyredirectcage"
Repository = "https://github.com/draarivpatel-ui/pyredirectcage"
Issues = "https://github.com/draarivpatel-ui/pyredirectcage/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyredirectcage = ["py.typed"]
